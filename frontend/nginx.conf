# nginx: sirve la SPA y reenvía /api y /health a la API (mismo origen: sin CORS en el navegador).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Cabeceras de seguridad para la aplicación web
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://api:8080;
    }

    # Archivos con hash en el nombre: se pueden cachear mucho tiempo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Rutas de la SPA (/empleados/7, /vacaciones...): siempre index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

# Ambiente completo en Docker: base de datos + API + aplicación web.
#
#   1) Copiar .env.example a .env (y cambiar las claves si se desea)
#   2) docker compose up -d --build        (o doble clic en levantar.cmd)
#
# Modo desarrollo (doble clic en levantar-dev.cmd, o `docker compose up --build --watch`):
#   al guardar cambios en src/ o frontend/, Docker reconstruye y reinicia solo el servicio afectado.
#
#   Aplicación web : http://localhost:8080
#   Swagger (API)  : http://localhost:5080/swagger
#
# Solo la base de datos (para depurar la API desde Visual Studio):  docker compose up -d sqlserver
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: rrhh-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD en el archivo .env}
    ports:
      # Puerto 14333 en tu PC para no chocar con un SQL Server local (1433)
      - "14333:1433"
    volumes:
      - rrhh-sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/RRHH.Api/Dockerfile
    container_name: rrhh-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      # Development: Swagger, migraciones automáticas y datos/usuarios demo (ambiente local de demostración).
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__RRHH: "Server=sqlserver,1433;Database=RRHH;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Jwt__Llave: ${JWT_LLAVE:?Define JWT_LLAVE en el archivo .env}
      Proxy__UsarCabecerasReenviadas: "true"
    ports:
      - "5080:8080"
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./src
          ignore:
            - "**/bin/"
            - "**/obj/"
        - action: rebuild
          path: ./Directory.Packages.props
        - action: rebuild
          path: ./Directory.Build.props

  web:
    build:
      context: ./frontend
    container_name: rrhh-web
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./frontend
          ignore:
            - node_modules/
            - dist/

volumes:
  rrhh-sqldata:
